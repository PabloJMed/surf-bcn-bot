name: daily

on:
  schedule:
    # UTC, cada 30 min de 4:17 a 9:47 (6:17–11:47 en Madrid en verano, 5:17–10:47 en invierno).
    # El cron de GitHub es "según disponibilidad": a veces retrasa o pierde disparos, así que
    # hay muchos intentos. El script envía en el primero con hora local ≥ 06:30 que no haya
    # enviado ya hoy (data/state.json); los demás terminan al momento sin hacer nada.
    - cron: "17,47 4-9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Enviar aunque ya se haya enviado hoy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # la punta de la rama, con el state.json más reciente

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m surfbot --send --force
          else
            python -m surfbot --send
          fi

      - name: Guardar estado e histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "data: $(TZ=Europe/Madrid date +%F)"
            git push
          fi
