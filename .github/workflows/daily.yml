name: daily

on:
  schedule:
    # UTC. Cubre las 06:47 de Madrid en verano (4:47 UTC) y en invierno (5:47 UTC).
    # El script decide si toca enviar: primera ejecución ≥ 06:30 que no haya enviado hoy.
    - cron: "47 4 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Enviar aunque ya se haya enviado hoy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # la punta de la rama, con el state.json más reciente

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m surfbot --send --force
          else
            python -m surfbot --send
          fi

      - name: Guardar estado e histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
          else
            git commit -m "data: $(TZ=Europe/Madrid date +%F)"
            git push
          fi
